services:
  - type: web
    name: eduverify-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: eduverify-db
          property: connectionString

databases:
  - name: eduverify-db
    plan: free
    databaseName: eduverify
    user: eduverify_user
